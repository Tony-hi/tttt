<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFEAF7">
<title>跳跃吧螃蟹先生！</title>
<style>
/* ============ Reset & Base ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-weight:700;color:#2A2640;background:#E8E3F5;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;outline:none}
svg{display:block}

/* ============ Variables ============ */
:root{
  --bg-1:#EFEAF7;--bg-2:#DCD3EE;
  --primary:#2C3E8F;--primary-2:#4F66B5;
  --green:#3DBE6F;--green-2:#2DAA59;
  --gold:#F4C25C;--gold-2:#D8A03A;
  --text:#2A2640;--text-mute:#6B6584;
  --card:#FFFFFF;--modal:#3A3550;
  --shadow:0 4px 16px rgba(80,60,140,.12);
  --shadow-lg:0 10px 30px rgba(80,60,140,.22);
  --r-sm:14px;--r-md:22px;--r-lg:28px;--r-xl:40px;
}

/* ============ App Container ============ */
.app{position:fixed;inset:0;overflow:hidden}
.app-inner{
  position:absolute;inset:0;
  background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
  overflow:hidden;
}
@media(orientation:landscape){
  .app{background:linear-gradient(180deg,#C9BEDF 0%,#B0A4D2 100%)}
  .app-inner{
    width:min(100vw,56.25vh);height:min(100vh,177.78vw);
    top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:var(--shadow-lg);border-radius:8px;
  }
}

/* ============ Views ============ */
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .28s ease;overflow:hidden}
.view.active{opacity:1;pointer-events:auto}

/* ============ Home View ============ */
.view-home{display:flex;flex-direction:column;align-items:center;padding:0 24px}
.home-deco-blob{position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(8px);pointer-events:none}
.home-deco-blob2{position:absolute;bottom:80px;right:30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.28);filter:blur(6px);pointer-events:none}
.home-title{padding-top:9vh;text-align:center;position:relative;z-index:2}
.home-title h1{
  font-size:clamp(54px,14vw,84px);color:#fff;font-weight:900;letter-spacing:6px;line-height:1;
  text-shadow:0 4px 14px rgba(80,60,140,.18);
}
.home-title p{font-size:clamp(30px,8.5vw,50px);color:#fff;font-weight:800;margin-top:10px;letter-spacing:3px}
.home-character{
  position:absolute;left:-22px;bottom:5vh;width:200px;height:240px;pointer-events:none;z-index:1;
}
.home-character svg{width:100%;height:100%}
.home-start-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,10%);z-index:3}
.btn-start{
  display:flex;align-items:center;gap:14px;
  background:#fff;color:var(--text);
  padding:18px 38px;border-radius:var(--r-xl);
  box-shadow:0 6px 22px rgba(80,60,140,.18);
  font-size:22px;font-weight:800;
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn-start:active{transform:scale(.97);box-shadow:0 3px 10px rgba(80,60,140,.18)}
.btn-start .arrow{color:var(--green);display:flex;align-items:center;justify-content:center}
.btn-start .arrow svg{width:28px;height:28px}
.home-more{
  position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.92);font-size:18px;font-weight:700;padding:14px 24px;
  display:flex;align-items:center;gap:6px;z-index:3;
}
.home-more:active{opacity:.7}

/* ============ Menu View ============ */
.view-menu{padding:0}
.btn-back{
  position:absolute;top:18px;left:18px;
  width:48px;height:48px;border-radius:50%;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(44,62,143,.35);
  z-index:5;
}
.btn-back:active{background:var(--primary-2);transform:scale(.95)}
.btn-back svg{width:22px;height:22px}
.page-title{font-size:24px;color:var(--text);font-weight:800;padding-top:24px;text-align:center}
.menu-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  padding:32px 20px 24px;max-width:480px;margin:0 auto;
}
.menu-card{
  background:var(--card);border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:24px 16px;min-height:130px;
  box-shadow:var(--shadow);
  transition:transform .15s ease,box-shadow .15s ease;
}
.menu-card:active{transform:scale(.96);box-shadow:0 2px 8px rgba(80,60,140,.12)}
.menu-card .icon{width:54px;height:54px;color:var(--primary);display:flex;align-items:center;justify-content:center}
.menu-card .icon svg{width:100%;height:100%}
.menu-card span{font-size:18px;color:var(--primary);font-weight:800}
.menu-card.wide{flex-direction:row;min-height:88px;justify-content:flex-start;padding:0 22px;gap:16px}
.menu-card.wide .icon{width:38px;height:38px;flex-shrink:0}
.menu-card.wide span{font-size:18px}
.menu-card.wide .arrow-right{margin-left:auto;color:var(--primary-2);display:flex;align-items:center}

/* ============ Shop View ============ */
.shop-header,.lottery-header{position:relative;padding:18px 20px;display:flex;align-items:center;justify-content:center}
.coin-display{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;
  background:#fff;padding:8px 16px;border-radius:24px;
  box-shadow:var(--shadow);
  font-size:18px;color:var(--text);font-weight:800;
}
.coin-display svg{width:22px;height:22px;color:var(--gold-2)}
.shop-stage{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  height:42vh;min-height:280px;padding:0 16px;
}
.shop-character{
  width:60vw;max-width:300px;height:100%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.shop-character canvas{width:100%;height:100%}
.shop-name-overlay{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.85);color:var(--text);
  font-size:14px;padding:4px 14px;border-radius:14px;
  white-space:nowrap;
}
.btn-arrow{
  width:46px;height:46px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);color:var(--text);
  flex-shrink:0;
}
.btn-arrow:active{transform:scale(.94);background:#F0EDF7}
.btn-arrow svg{width:18px;height:18px}
.shop-preview{
  display:flex;gap:12px;overflow-x:auto;
  padding:8px 20px 12px;margin:0 0 8px;
  scrollbar-width:none;
}
.shop-preview::-webkit-scrollbar{display:none}
.preview-item{
  flex:0 0 auto;width:74px;height:74px;border-radius:18px;
  background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  position:relative;padding:8px;
  border:3px solid transparent;
  transition:border-color .15s ease,transform .15s ease;
}
.preview-item.selected{border-color:var(--green)}
.preview-item.locked .lock{position:absolute;bottom:4px;right:4px;background:rgba(42,38,64,.85);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.btn-action-wrap{padding:0 24px 32px}
.btn-action{
  width:100%;padding:18px;border-radius:var(--r-lg);
  background:#fff;color:var(--text);
  box-shadow:0 4px 14px rgba(80,60,140,.15);
  font-size:20px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-action:disabled{background:#E5E0EF;color:var(--text-mute);box-shadow:none}
.btn-action:active:not(:disabled){transform:scale(.99)}
.btn-action .price{color:var(--gold-2);display:inline-flex;align-items:center;gap:4px}
.btn-action .price svg{width:20px;height:20px}

/* ============ Lottery View ============ */
.view-lottery{display:flex;flex-direction:column}
.lottery-stage{
  flex:1;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;
}
.lottery-character{position:relative;width:60vw;max-width:280px;height:340px;display:flex;align-items:center;justify-content:center}
.lottery-character canvas{width:100%;height:100%}
.lottery-text{
  position:absolute;right:14%;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:30px;color:var(--gold-2);font-weight:900;
  letter-spacing:6px;
  text-shadow:0 2px 6px rgba(216,160,58,.35);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
}
.coin-floater{
  position:absolute;color:var(--gold-2);font-size:24px;
  animation:float 3s ease-in-out infinite;
  pointer-events:none;
  filter:drop-shadow(0 2px 4px rgba(216,160,58,.4));
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-14px) rotate(8deg)}
}
.btn-gold{
  margin:0 24px 36px;width:calc(100% - 48px);
  padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold-2) 100%);
  color:#fff;font-size:20px;font-weight:800;
  box-shadow:0 6px 16px rgba(216,160,58,.4);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-gold:active{transform:scale(.99)}
.btn-gold:disabled{opacity:.5;filter:grayscale(.3)}
.btn-gold svg{width:22px;height:22px}

.lottery-anim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.lottery-anim .bubble{background:rgba(255,255,255,.95);color:var(--text);padding:16px 28px;border-radius:24px;font-size:22px;font-weight:800;box-shadow:var(--shadow-lg);animation:lottery-anim 1.2s ease forwards}
@keyframes lottery-anim{
  0%{transform:scale(.5) rotate(-15deg);opacity:0}
  20%{transform:scale(1.1) rotate(5deg);opacity:1}
  60%{transform:scale(1) rotate(0);opacity:1}
  100%{transform:scale(1.6);opacity:0}
}

/* ============ Play View ============ */
.view-play{background:var(--bg-1)}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-score{
  position:absolute;top:24px;left:50%;transform:translateX(-50%);
  font-size:60px;font-weight:900;color:var(--text);
  font-variant-numeric:tabular-nums;
  text-shadow:0 3px 8px rgba(80,60,140,.12);
  pointer-events:none;letter-spacing:4px;
  font-family:"Impact","DIN Alternate",-apple-system,sans-serif;
}
.hud-power{
  position:absolute;bottom:8vh;left:10%;width:80%;
  height:18px;border-radius:18px;
  background:rgba(255,255,255,.55);
  box-shadow:var(--shadow);
  overflow:hidden;pointer-events:none;
  border:2px solid rgba(255,255,255,.7);
}
.hud-power-fill{
  width:0%;height:100%;
  background:linear-gradient(90deg,var(--green) 0%,var(--gold) 60%,#E85A4F 100%);
  border-radius:18px;
  transition:width .04s linear;
}
.hud-hint{
  position:absolute;bottom:13vh;left:50%;transform:translateX(-50%);
  color:var(--text-mute);font-size:14px;font-weight:700;
  pointer-events:none;opacity:.8;
  animation:hint-pulse 1.5s ease-in-out infinite;
}
@keyframes hint-pulse{0%,100%{opacity:.5}50%{opacity:.9}}
.hud-pause{
  position:absolute;top:24px;right:20px;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.88);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.hud-pause:active{transform:scale(.94)}
.hud-pause svg{width:22px;height:22px;color:var(--text)}

.score-popup{
  position:absolute;font-size:24px;font-weight:900;color:var(--green-2);
  pointer-events:none;animation:score-up 1.2s ease-out forwards;
  text-shadow:0 2px 6px rgba(80,60,140,.15);
}
@keyframes score-up{
  0%{transform:translate(-50%,0) scale(.6);opacity:0}
  20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-60px) scale(.9);opacity:0}
}

/* ============ Modals ============ */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(40,30,60,.6);backdrop-filter:blur(6px)}
.modal-card{
  position:relative;background:var(--modal);
  border-radius:var(--r-lg);padding:32px 24px;
  width:100%;max-width:360px;text-align:center;color:#fff;
  box-shadow:var(--shadow-lg);
  animation:pop-in .3s cubic-bezier(.34,1.56,.64,1);
}
.modal-card.light{background:#fff;color:var(--text)}
@keyframes pop-in{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-card h3{font-size:30px;font-weight:900;margin-bottom:16px;letter-spacing:2px}
.modal-card p{font-size:16px;line-height:1.7;color:rgba(255,255,255,.9);text-align:left}
.modal-card.light p{color:var(--text-mute);text-align:left}

.gameover-stats{display:flex;gap:14px;margin:20px 0 16px}
.stat{flex:1;background:rgba(255,255,255,.08);border-radius:18px;padding:14px 8px}
.modal-card.light .stat{background:#F5F2FA}
.stat-label{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:700}
.modal-card.light .stat-label{color:var(--text-mute)}
.stat-value{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
.gameover-coins{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;margin-bottom:20px;font-weight:800}
.gameover-coins svg{width:26px;height:26px;color:var(--gold)}
.gameover-buttons{display:flex;flex-direction:column;gap:12px}
.modal-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px;border-radius:var(--r-md);
  background:#fff;color:var(--text);font-size:18px;font-weight:800;
  box-shadow:0 4px 12px rgba(80,60,140,.18);
}
.modal-btn:active{transform:scale(.98)}
.modal-btn .ico{width:24px;height:24px;color:var(--green);display:flex;align-items:center;justify-content:center}
.modal-btn .ico svg{width:100%;height:100%}
.modal-btn small{font-size:12px;color:var(--text-mute);margin-left:6px;font-weight:700}
.modal-btn.secondary{background:#F5F2FA;color:var(--text);box-shadow:none}

.redeem-input{
  width:100%;padding:14px 16px;margin:16px 0 8px;
  border:2px solid #E5E0EF;border-radius:var(--r-md);
  font-size:18px;font-weight:700;color:var(--text);
  background:#F5F2FA;outline:none;
  text-align:center;letter-spacing:1px;
}
.redeem-input:focus{border-color:var(--primary)}
.redeem-buttons{display:flex;gap:10px}
.redeem-buttons .modal-btn{flex:1}
.redeem-msg{min-height:22px;font-size:14px;color:var(--green-2);margin-bottom:8px;font-weight:700}

.result-content{padding:10px 0 20px}
.result-content .result-icon{font-size:72px;margin-bottom:8px;line-height:1}
.result-content .result-title{font-size:24px;font-weight:900;color:var(--text);margin-bottom:4px}
.result-content .result-sub{font-size:16px;color:var(--text-mute);font-weight:700}

@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}

.toast{
  position:fixed;left:50%;bottom:18%;transform:translateX(-50%);
  background:rgba(42,38,64,.92);color:#fff;padding:12px 24px;border-radius:24px;
  font-size:15px;font-weight:700;z-index:300;
  box-shadow:var(--shadow-lg);
  animation:toast-in .25s ease,toast-out .25s ease 1.6s forwards;
  pointer-events:none;
}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toast-out{to{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>

  </defs>
</svg>

<div class="app">
  <div class="app-inner" id="app-inner">

    <section class="view view-home active" id="view-home">
      <div class="home-deco-blob"></div>
      <div class="home-deco-blob2"></div>
      <div class="home-title">
        <h1>跳跃吧</h1>
        <p>螃蟹先生！</p>
      </div>
      <div class="home-character">
        <svg viewBox="0 0 200 240">
          <g>
            <polygon points="20,150 130,150 130,210 20,210" fill="#A6AFC6"/>
            <polygon points="20,150 130,150 158,128 48,128" fill="#D2D6E2"/>

<script>
'use strict';

/* ============ 1. Storage Layer ============ */
const Storage = {
  K_COINS:'jbc.coins', K_BEST:'jbc.bestScore', K_SKINS:'jbc.unlockedSkins', K_CURRENT:'jbc.currentSkin',
  getCoins(){const v=parseInt(localStorage.getItem(this.K_COINS)||'0',10);return isNaN(v)?0:v;},
  setCoins(n){localStorage.setItem(this.K_COINS,String(Math.max(0,n|0)));},
  addCoins(n){this.setCoins(this.getCoins()+n);},
  getBest(){const v=parseInt(localStorage.getItem(this.K_BEST)||'0',10);return isNaN(v)?0:v;},
  setBest(n){localStorage.setItem(this.K_BEST,String(Math.max(0,n|0)));},
  getUnlocked(){try{return JSON.parse(localStorage.getItem(this.K_SKINS)||'["compass"]');}catch(e){return ['compass'];}},
  setUnlocked(arr){localStorage.setItem(this.K_SKINS,JSON.stringify(arr));},
  unlock(id){const arr=this.getUnlocked();if(!arr.includes(id)){arr.push(id);this.setUnlocked(arr);}},
  hasSkin(id){return this.getUnlocked().includes(id);},
  getCurrent(){return localStorage.getItem(this.K_CURRENT)||'compass';},
  setCurrent(id){localStorage.setItem(this.K_CURRENT,id);}
};

/* ============ 2. Skins ============ */
const SKINS = [
  { id:'compass', name:'圆规叔叔', price:0 },
  { id:'pawn',    name:'象棋-兵',   price:200 }
];

/* ============ 3. Character drawing (origin = feet center) ============ */
function drawCompassCharacter(ctx,size,t){
  const s=size/110;
  ctx.save();
  ctx.lineCap='round';
  ctx.lineWidth=5.5*s;
  ctx.strokeStyle='#3A4570';
  ctx.beginPath();
  ctx.moveTo(-10*s,0); ctx.lineTo(-4*s,-42*s);
  ctx.moveTo(10*s,0);  ctx.lineTo(4*s,-42*s);
  ctx.stroke();
  ctx.fillStyle='#1F2746';
  ctx.beginPath();
  ctx.arc(-10*s,0,3*s,0,Math.PI*2);
  ctx.arc(10*s,0,3*s,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#F8E9D0';
  ctx.beginPath(); ctx.arc(0,-55*s,15*s,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2A2640'; ctx.lineWidth=1.8*s; ctx.stroke();
  ctx.fillStyle='#3A4570';
  ctx.beginPath(); ctx.arc(0,-75*s,4.5*s,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2A2640'; ctx.lineWidth=1.2*s; ctx.stroke();
  ctx.fillStyle='#1F2746';
  ctx.beginPath(); ctx.arc(0,-75*s,1.8*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3A4570'; ctx.fillRect(-1.8*s,-94*s,3.6*s,16*s);
  ctx.fillStyle='#3DBE6F';
  ctx.beginPath(); ctx.arc(0,-96*s,4.2*s,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2A2640'; ctx.lineWidth=1*s; ctx.stroke();
  ctx.strokeStyle='#2A2640'; ctx.lineWidth=3.2*s; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-9*s,-62*s); ctx.lineTo(-3*s,-59*s);
  ctx.moveTo(9*s,-62*s);  ctx.lineTo(3*s,-59*s);
  ctx.stroke();
  ctx.fillStyle='#2A2640';
  ctx.beginPath();
  ctx.arc(-4.5*s,-54*s,1.5*s,0,Math.PI*2);
  ctx.arc(4.5*s,-54*s,1.5*s,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(232,100,100,0.65)';
  ctx.beginPath();
  ctx.arc(-8*s,-50*s,2.5*s,0,Math.PI*2);
  ctx.arc(8*s,-50*s,2.5*s,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#2A2640'; ctx.lineWidth=1.6*s; ctx.lineCap='round';
  ctx.beginPath();
  ctx.arc(0,-51*s,4.5*s,0,Math.PI,false);
  ctx.stroke();
  ctx.restore();
}

function drawPawnCharacter(ctx,size,t){
  const s=size/110;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0,2,22*s,4*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#6B4226';
  ctx.beginPath();
  ctx.ellipse(0,0,22*s,6*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#8B5A36';
  ctx.strokeStyle='#2A1810';
  ctx.lineWidth=2*s;
  ctx.beginPath();
  ctx.moveTo(-20*s,0); ctx.lineTo(20*s,0);
  ctx.quadraticCurveTo(18*s,-22*s,14*s,-32*s);
  ctx.lineTo(10*s,-38*s); ctx.lineTo(10*s,-44*s);
  ctx.quadraticCurveTo(9*s,-50*s,7*s,-54*s);
  ctx.bezierCurveTo(7*s,-68*s,-7*s,-68*s,-7*s,-54*s);
  ctx.quadraticCurveTo(-9*s,-50*s,-10*s,-44*s);
  ctx.lineTo(-10*s,-38*s); ctx.lineTo(-14*s,-32*s);
  ctx.quadraticCurveTo(-18*s,-22*s,-20*s,0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(-18*s,-2);
  ctx.quadraticCurveTo(-15*s,-22*s,-11*s,-32*s);
  ctx.lineTo(-9*s,-32*s);
  ctx.quadraticCurveTo(-12*s,-22*s,-15*s,-2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#2A1810'; ctx.lineWidth=2.4*s; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-4.5*s,-64*s); ctx.lineTo(-1*s,-62*s);
  ctx.moveTo(4.5*s,-64*s);  ctx.lineTo(1*s,-62*s);
  ctx.stroke();
  ctx.fillStyle='#2A1810';
  ctx.beginPath();
  ctx.arc(-2.5*s,-58*s,0.9*s,0,Math.PI*2);
  ctx.arc(2.5*s,-58*s,0.9*s,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(232,100,100,0.65)';
  ctx.beginPath();
  ctx.arc(-4.5*s,-54*s,1.6*s,0,Math.PI*2);
  ctx.arc(4.5*s,-54*s,1.6*s,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#2A1810'; ctx.lineWidth=1.2*s;
  ctx.beginPath();
  ctx.arc(0,-55*s,2.5*s,0,Math.PI,false);
  ctx.stroke();
  ctx.fillStyle='#D8A03A';
  ctx.beginPath();
  ctx.arc(0,-68*s,1.8*s,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCharacter(ctx,skinId,size,t){
  if(skinId==='pawn') drawPawnCharacter(ctx,size,t);
  else drawCompassCharacter(ctx,size,t);
}

/* ============ 4. Router ============ */
const Router = {
  current:'home',
  show(viewId){
    if(this.current===viewId) return;
    const from=document.getElementById('view-'+this.current);
    const to=document.getElementById('view-'+viewId);
    if(from) from.classList.remove('active');
    if(to)   to.classList.add('active');
    this.current=viewId;
    if(viewId==='shop')    Shop.render();
    if(viewId==='lottery') Lottery.render();
    if(viewId==='play')    Game.start();
  }
};

/* ============ 5. Shop ============ */
const Shop = {
  index:0,
  get current(){ return SKINS[this.index]; },
  render(){
    this.index = Math.max(0, SKINS.findIndex(s=>s.id===Storage.getCurrent()));
    if(this.index<0) this.index=0;
    document.getElementById('shop-coins').textContent = Storage.getCoins();
    this.drawMain();
    this.drawPreview();
    this.updateAction();
    this._ro=this._ro||new ResizeObserver(()=>{this.drawMain();this.drawPreview();});
    const stage=document.querySelector('.shop-stage');
    if(stage && !stage.dataset.bound) { this._ro.observe(stage); stage.dataset.bound='1'; }
  },
  drawMain(){
    const cv=document.getElementById('shop-canvas');
    const rect=cv.getBoundingClientRect();
    if(rect.width<10) return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=rect.width*dpr; cv.height=rect.height*dpr;
    const ctx=cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.fillStyle='rgba(0,0,0,0.10)';
    ctx.beginPath();
    ctx.ellipse(rect.width/2,rect.height*0.86,50,10,0,0,Math.PI*2);
    ctx.fill();
    ctx.save();
    ctx.translate(rect.width/2,rect.height*0.78);
    drawCharacter(ctx,this.current.id,Math.min(rect.width*0.6,rect.height*0.7),performance.now());
    ctx.restore();
    document.getElementById('shop-skin-name').textContent=this.current.name;
    document.getElementById('shop-skin-overlay').textContent=this.current.name;
  },
  drawPreview(){
    const wrap=document.getElementById('shop-preview');
    wrap.innerHTML='';
    SKINS.forEach((s,i)=>{
      const item=document.createElement('div');
      item.className='preview-item';
      if(s.id===this.current.id) item.classList.add('selected');
      if(!Storage.hasSkin(s.id)) item.classList.add('locked');
      const cv=document.createElement('canvas');
      cv.width=100; cv.height=100;
      const ctx=cv.getContext('2d');
      ctx.save();
      ctx.translate(50,86);
      drawCharacter(ctx,s.id,78,performance.now());
      ctx.restore();
      item.appendChild(cv);
      if(!Storage.hasSkin(s.id)){
        const lock=document.createElement('div');
        lock.className='lock'; lock.textContent='🔒';
        item.appendChild(lock);
      }
      item.addEventListener('click',()=>{
        this.index=i;
        this.drawMain();
        this.drawPreview();
        this.updateAction();
      });
      wrap.appendChild(item);
    });
  },
  updateAction(){
    const btn=document.getElementById('btn-skin-action');
    const s=this.current;
    if(s.id===Storage.getCurrent()){
      btn.innerHTML='使用中';
      btn.disabled=true;
      btn.onclick=null;
    } else if(Storage.hasSkin(s.id)){
      btn.innerHTML='使 用';
      btn.disabled=false;
      btn.onclick=()=>this.equip();
    } else {
      btn.innerHTML=`<span class="price"><svg><use href="#i-coin"/></svg>${s.price} 解锁</span>`;
      btn.disabled=Storage.getCoins()<s.price;
      btn.onclick=()=>this.unlock();
    }
  },
  equip(){
    Storage.setCurrent(this.current.id);
    this.updateAction();
    this.drawPreview();
    toast('已穿戴 '+this.current.name);
  },
  unlock(){
    const s=this.current;
    if(Storage.getCoins()<s.price){toast('金币不足');return;}
    Storage.setCoins(Storage.getCoins()-s.price);
    Storage.unlock(s.id);
    Storage.setCurrent(s.id);
    this.updateAction();
    this.drawPreview();
    document.getElementById('shop-coins').textContent=Storage.getCoins();
    toast('已解锁 '+s.name);
  }
};

/* ============ 6. Lottery ============ */
const LOTTERY_COST=100;
const LOTTERY_POOL=[
  {type:'coins',value:50,  weight:40},
  {type:'coins',value:100, weight:30},
  {type:'coins',value:200, weight:15},
  {type:'coins',value:500, weight:5 },
  {type:'skin', value:'pawn',weight:10}
];
const Lottery = {
  rolling:false,
  render(){
    document.getElementById('lottery-coins').textContent=Storage.getCoins();
    this.draw();
  },
  draw(){
    const cv=document.getElementById('lottery-canvas');
    const rect=cv.getBoundingClientRect();
    if(rect.width<10) return;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=rect.width*dpr; cv.height=rect.height*dpr;
    const ctx=cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,rect.width,rect.height);
    const cx=rect.width/2, cy=rect.height*0.5;
    const grd=ctx.createRadialGradient(cx,cy,10,cx,cy,rect.width*0.7);
    grd.addColorStop(0,'rgba(244,194,92,0.5)');
    grd.addColorStop(1,'rgba(244,194,92,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(cx,cy,rect.width*0.7,0,Math.PI*2); ctx.fill();
    drawLotteryCharacter(ctx,cx,cy,rect.width,rect.height,performance.now());
  },
  roll(){
    if(this.rolling) return;
    if(Storage.getCoins()<LOTTERY_COST){toast('金币不足');return;}
    this.rolling=true;
    Storage.setCoins(Storage.getCoins()-LOTTERY_COST);
    document.getElementById('lottery-coins').textContent=Storage.getCoins();
    const stage=document.getElementById('lottery-stage');
    const anim=document.createElement('div');
    anim.className='lottery-anim';
    anim.innerHTML='<div class="bubble">抽签中…</div>';
    stage.appendChild(anim);
    setTimeout(()=>anim.remove(),1200);
    setTimeout(()=>{
      const total=LOTTERY_POOL.reduce((s,p)=>s+p.weight,0);
      let r=Math.random()*total, pick=LOTTERY_POOL[0];
      for(const p of LOTTERY_POOL){r-=p.weight;if(r<=0){pick=p;break;}}
      this.grant(pick);
      this.rolling=false;
    },1100);
  },
  grant(pick){
    let title,sub,icon;
    if(pick.type==='coins'){
      Storage.addCoins(pick.value);
      title='恭喜获得金币';
      sub='+'+pick.value+' 金币';
      icon='💰';
    } else {
      const skin=SKINS.find(s=>s.id===pick.value);
      if(!skin){title='再接再厉';sub='+50 金币';icon='🎁';Storage.addCoins(50);}
      else if(Storage.hasSkin(skin.id)){
        title='已拥有该皮肤';
        sub='返还 200 金币';
        icon='🎁';
        Storage.addCoins(200);
      } else {
        Storage.unlock(skin.id);
        title='恭喜获得新皮肤';
        sub=skin.name;
        icon='👑';
      }
    }
    document.getElementById('lottery-coins').textContent=Storage.getCoins();
    showResult(icon,title,sub);
  }
};

/* ============ 7. Game Engine ============ */
const Game = {
  canvas:null, ctx:null, W:0, H:0, dpr:1,
  running:false, rafId:0, lastT:0,
  blocks:[],
  char:{x:0,y:0,vx:0,vy:0,rot:0,onGround:true,bounceT:0,landedOn:null,combo:0,squash:0,prevY:0},
  cameraX:0,
  power:0, charging:false, chargeStart:0,
  score:0, best:0, hintShown:false,
  particles:[],
  lastGapType:0,

  init(){
    this.canvas=document.getElementById('game-canvas');
    this.ctx=this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.resize(),300));
  },
  resize(){
    const rect=this.canvas.getBoundingClientRect();
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=Math.max(1,Math.floor(rect.width*this.dpr));
    this.canvas.height=Math.max(1,Math.floor(rect.height*this.dpr));
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.W=rect.width; this.H=rect.height;
    this.groundY=this.H*0.7;
  },
  BLOCK_SIZE: 80,
  BLOCK_HEIGHT_RATIO: 0.42,
  start(){
    if(this.running){ this.resize(); }
    this.running=true;
    this.score=0; this.combo=0;
    this.blocks=[];
    const blockH = this.BLOCK_SIZE * this.BLOCK_HEIGHT_RATIO;
    const topY = this.groundY - blockH;
    this.char={x:0,y:topY,vx:0,vy:0,rot:0,onGround:true,bounceT:0,landedOn:null,combo:0,squash:0,prevY:topY};
    this.cameraX=0;
    this.charging=false; this.power=0; this.hintShown=false;
    this.lastGapType=0;
    this.particles = [];
    document.getElementById('hud-power-fill').style.width='0%';
    document.getElementById('hud-hint').style.display='block';
    const b1 = this.makeBlock(40, topY, 0);
    b1.squash = 0;
    this.blocks.push(b1);
    this.spawnNextBlock();
    this.char.x = b1.x + b1.w / 2;
    this.updateCamera();
    this.updateScore();
    cancelAnimationFrame(this.rafId);
    this.lastT=performance.now();
    this.loop();
  },
  makeBlock(x, y, gapType){
    const s = this.BLOCK_SIZE;
    // gapType 0=basic(gray), 1=gift box, 2=book
    const themes = [
      { id:'basic',  score:1,  size: 1.0,  height: 0.42 },
      { id:'gift',   score:3,  size: 0.95, height: 0.55 },
      { id:'book',   score:5,  size: 0.90, height: 0.50 }
    ];
    const theme = themes[gapType] || themes[0];
    return {
      x: x,
      y: y,
      w: s * theme.size,
      h: s * theme.height,
      type: gapType,
      theme: theme.id,
      score: theme.score,
      squash: 0 // 0 = normal, 1 = fully squashed
    };
  },
  spawnNextBlock(){
    let last = null;
    for(const b of this.blocks){
      if(!last || b.x > last.x) last = b;
    }
    if(!last) return;
    const gaps = [
      {min: 70,  max: 120, type:0, weight: 50},
      {min: 130, max: 180, type:1, weight: 30},
      {min: 190, max: 250, type:2, weight: 20}
    ];
    let pool = gaps.slice();
    if(this.lastGapType >= 0){
      pool = pool.map(g => ({...g, weight: g.type===this.lastGapType ? g.weight*0.5 : g.weight}));
    }
    const total = pool.reduce((s,g)=>s+g.weight, 0);
    let r = Math.random() * total, chosen = pool[0];
    for(const g of pool){ r -= g.weight; if(r<=0){ chosen = g; break; } }
    const gap = chosen.min + Math.random() * (chosen.max - chosen.min);
    const newX = last.x + last.w + gap;
    const baseTopY = this.groundY - this.BLOCK_SIZE * 0.42;
    const yVar = (Math.random() - 0.5) * 16;
    const nb = this.makeBlock(newX, baseTopY + yVar, chosen.type);
    this.blocks.push(nb);
    this.lastGapType = chosen.type;
    this.blocks = this.blocks.slice(-2);
  },
  updateCamera(){
    this.cameraX=this.char.x-this.W*0.3;
    if(this.cameraX<-this.W*0.2) this.cameraX=-this.W*0.2;
  },
  screenX(worldX){ return worldX-this.cameraX; },

  onPressStart(){
    if(!this.running) return;
    if(!this.char.onGround) return;
    this.charging=true;
    this.chargeStart=performance.now();
    document.getElementById('hud-hint').style.display='none';
  },
  onPressEnd(){
    if(!this.charging) return;
    this.charging=false;
    const elapsed=(performance.now()-this.chargeStart)/1000;
    const power=Math.min(elapsed/2.0,1);
    this.power=power;
    this.jump(power);
    document.getElementById('hud-power-fill').style.width='0%';
  },
  jump(power){
    this.char.onGround=false;
    const minDist = 40;
    const maxDist = 400;
    const minHeight = 40;
    const maxHeight = 200;
    const dist = minDist + power * (maxDist - minDist);
    const height = minHeight + power * (maxHeight - minHeight);
    const gravity = 1400;
    const upTime = Math.sqrt(2 * height / gravity);
    const totalTime = upTime * 2;
    this.char.vx = dist / totalTime;
    this.char.vy = -Math.sqrt(2 * gravity * height);
    this.char.rot=0;
    this.char.rotSpeed=0;
  },

  loop(){
    if(!this.running) return;
    const now=performance.now();
    let dt=(now-this.lastT)/1000;
    if(dt>0.05) dt=0.05;
    this.lastT=now;
    this.update(dt);
    this.draw();
    this.rafId=requestAnimationFrame(()=>this.loop());
  },

  update(dt){
    if(this.charging){
      const elapsed=(performance.now()-this.chargeStart)/1000;
      const p=Math.min(elapsed/2.0,1);
      document.getElementById('hud-power-fill').style.width=(p*100)+'%';
      this.char.squash = p * 0.35;
      if(this.char.landedOn){
        this.char.landedOn.squash = p * 0.25;
      }
      this.spawnChargeParticles(p);
    } else {
      if(this.char.squash > 0){
        this.char.squash = Math.max(0, this.char.squash - dt * 4);
      }
      for(const b of this.blocks){
        if(b.squash > 0){
          b.squash = Math.max(0, b.squash - dt * 5);
        }
      }
    }

    this.updateParticles(dt);

    if(!this.char.onGround){
      this.char.prevY = this.char.y;
      this.char.vy += 1600*dt;
      this.char.x += this.char.vx*dt;
      this.char.y += this.char.vy*dt;
      this.char.rot += this.char.rotSpeed;

      if(this.char.vy > 0){
        for(const b of this.blocks){
          if(b === this.char.landedOn) continue;
          if(this.char.x >= b.x && this.char.x <= b.x + b.w){
            if(this.char.prevY <= b.y + 2 && this.char.y >= b.y){
              this.landOn(b);
              break;
            }
          }
        }
      }

      if(this.char.y > this.H + 100){
        this.end();
      }
    } else {
      let stillOnBlock = false;
      for(const b of this.blocks){
        if(this.char.x >= b.x && this.char.x <= b.x + b.w && Math.abs(this.char.y - b.y) < 5){
          stillOnBlock = true;
          break;
        }
      }
      if(!stillOnBlock){
        this.char.onGround = false;
        this.char.vy = 0;
        this.char.vx = 0;
        this.char.landedOn = null;
      } else {
        if(this.char.bounceT>0){
          this.char.bounceT-=dt;
          if(this.char.bounceT<0) this.char.bounceT=0;
        }
      }
    }

    this.updateCamera();
  },
  spawnChargeParticles(power){
    if(!this.char.landedOn) return;
    if(Math.random() > 0.6) return;
    const b = this.char.landedOn;
    const sx = this.screenX(this.char.x);
    const baseY = b.y + b.h * (1 - b.squash * 0.5);
    const angle = Math.random() * Math.PI * 2;
    const radius = 10 + Math.random() * 20;
    const targetAngle = Math.PI * 0.5 + (Math.random() - 0.5) * 0.6;
    this.particles.push({
      x: this.char.x + Math.cos(angle) * radius,
      y: baseY - 10 + Math.random() * 20,
      vx: Math.cos(targetAngle) * (30 + power * 60),
      vy: -Math.sin(targetAngle) * (40 + power * 80),
      life: 0.6,
      maxLife: 0.6,
      size: 2 + Math.random() * 3,
      color: `rgba(255,255,255,` + (0.6 + power * 0.3) + `)`
    });
  },
  updateParticles(dt){
    for(let i = this.particles.length - 1; i >= 0; i--){
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
      if(p.life <= 0){
        this.particles.splice(i, 1);
      }
    }
  },
  drawParticles(ctx){
    for(const p of this.particles){
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = p.color.replace(/[\d.]+\)$/, alpha.toFixed(2) + ')');
      ctx.beginPath();
      ctx.arc(this.screenX(p.x), p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
  },

  landOn(b){
    const wasOnBlock = this.char.landedOn;
    this.char.y=b.y;
    this.char.vy=0;
    this.char.onGround=true;
    this.char.rot=0;
    this.char.landedOn=b;
    this.char.bounceT=0.25;

    // Landed on a different block = successful jump
    if(b !== wasOnBlock){
      const base = b.score || 1;
      const comboBonus=(this.combo>=1)?2:0;
      const gain=base+comboBonus;
      this.combo++;
      this.score+=gain;
      Storage.addCoins(gain);
      if(this.score>Storage.getBest()) Storage.setBest(this.score);
      this.updateScore();
      this.popupScore(this.screenX(this.char.x), this.H*0.3, '+'+gain);
      // Spawn next block ahead, old one gets removed in spawnNextBlock
      this.spawnNextBlock();
    }

    if(navigator.vibrate) try{ navigator.vibrate(20); }catch(e){}
  },

  popupScore(x,y,text){
    const el=document.createElement('div');
    el.className='score-popup';
    el.textContent=text;
    el.style.left=x+'px';
    el.style.top=y+'px';
    document.getElementById('view-play').appendChild(el);
    setTimeout(()=>el.remove(),1200);
  },

  updateScore(){
    const s = this.score < 100 ? String(this.score).padStart(2,'0') : String(this.score);
    document.getElementById('hud-score').textContent = s;
  },

  end(revive){
    this.running=false;
    cancelAnimationFrame(this.rafId);
    // Update best in modal
    const best=Storage.getBest();
    const fmt = (n) => n < 100 ? String(n).padStart(2,'0') : String(n);
    document.getElementById('stat-best').textContent = fmt(best);
    document.getElementById('stat-current').textContent = fmt(this.score);
    document.getElementById('stat-coins').textContent=Storage.getCoins();
    const reviveBtn=document.getElementById('btn-revive');
    reviveBtn.disabled=Storage.getCoins()<100;
    if(revive) return; // resumed
    setTimeout(()=>{
      document.getElementById('modal-gameover').classList.add('show');
    },500);
    if(navigator.vibrate) try{ navigator.vibrate([40,60,40]); }catch(e){}
  },

  draw(){
    const ctx=this.ctx;
    // Sky gradient
    const grd=ctx.createLinearGradient(0,0,0,this.H);
    grd.addColorStop(0,'#F4EFFA');
    grd.addColorStop(1,'#E0D6F0');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,this.W,this.H);

    // Decorative distant clouds
    this.drawClouds(ctx);

    // Ground baseline (faint)
    ctx.strokeStyle='rgba(120,100,170,0.15)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,this.groundY+50);
    ctx.lineTo(this.W,this.groundY+50);
    ctx.stroke();

    // Blocks
    for(const b of this.blocks){
      this.drawBlock(ctx,b);
    }

    // Particles
    this.drawParticles(ctx);

    // Character
    this.drawChar(ctx);
  },
  drawClouds(ctx){
    const cam=this.cameraX;
    const off=cam*0.1;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(const c of [{x:120-off*0.5,y:80,r:30},{x:340-off*0.7,y:140,r:22},{x:560-off*0.3,y:60,r:28}]){
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.arc(c.x+c.r*0.7,c.y+4,c.r*0.7,0,Math.PI*2);
      ctx.arc(c.x-c.r*0.6,c.y+4,c.r*0.6,0,Math.PI*2);
      ctx.fill();
    }
  },
  drawBlock(ctx,b){
    const sx=this.screenX(b.x);
    const s = b.w;
    if(sx>this.W+150 || sx+s<-150) return;
    const top = b.y;
    const squash = b.squash || 0;
    const sqH = 1 - squash;
    const sqW = 1 + squash * 0.2;
    const ws = s * sqW;
    const isoDx = ws * 0.55;
    const isoDy = ws * 0.28;
    const blockH = b.h * sqH;
    const bx = sx - (ws - s) / 2;
    const by = top + (b.h - blockH);

    // Shadow
    ctx.fillStyle='rgba(50,30,80,0.18)';
    ctx.beginPath();
    ctx.ellipse(bx + ws/2 - isoDx*0.3, by + blockH + 4, ws*0.5, 5, 0, 0, Math.PI*2);
    ctx.fill();

    if(b.theme === 'gift'){
      this.drawGiftBlock(ctx, bx, by, ws, blockH, isoDx, isoDy);
    } else if(b.theme === 'book'){
      this.drawBookBlock(ctx, bx, by, ws, blockH, isoDx, isoDy);
    } else {
      this.drawBasicBlock(ctx, bx, by, ws, blockH, isoDx, isoDy);
    }
  },
  drawBasicBlock(ctx, x, y, w, h, isoDx, isoDy){
    // Right face (darkest)
    ctx.fillStyle = '#6B7280';
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    // Right face inner shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.moveTo(x + w, y + h*0.6);
    ctx.lineTo(x + w - isoDx, y + h*0.6 - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // Front face (medium)
    ctx.fillStyle = '#9CA3AF';
    ctx.fillRect(x, y, w, h);
    // Front face highlight top
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x, y, w, h * 0.15);
    // Front face shadow bottom
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x, y + h * 0.7, w, h * 0.3);

    // Top face (lightest)
    ctx.fillStyle = '#D1D5DB';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.fill();
    // Top face highlight front edge
    ctx.fillStyle = '#E5E7EB';
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 0.5);
    ctx.lineTo(x + w - 2, y + 0.5);
    ctx.lineTo(x + w - 5, y + 3);
    ctx.lineTo(x + 5, y + 3);
    ctx.closePath();
    ctx.fill();
    // Top face inner shadow (back edge)
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.moveTo(x - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx + 3, y - isoDy + 3);
    ctx.lineTo(x - isoDx + 3, y - isoDy + 3);
    ctx.closePath();
    ctx.fill();

    // Edge outline
    ctx.strokeStyle = 'rgba(40,40,60,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w, y + h);
    ctx.moveTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.stroke();
  },
  drawGiftBlock(ctx, x, y, w, h, isoDx, isoDy){
    const lidH = h * 0.22;
    const bodyY = y + lidH;
    const bodyH = h - lidH;
    const ribbonW = w * 0.18;
    const ribbonX = x + w/2 - ribbonW/2;

    // Right face body (darkest red)
    ctx.fillStyle = '#A03030';
    ctx.beginPath();
    ctx.moveTo(x + w, bodyY);
    ctx.lineTo(x + w - isoDx, bodyY - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    // Right face bottom shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.moveTo(x + w, y + h * 0.65);
    ctx.lineTo(x + w - isoDx, y + h * 0.65 - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // Right face lid
    ctx.fillStyle = '#C04040';
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, bodyY - isoDy);
    ctx.lineTo(x + w, bodyY);
    ctx.closePath();
    ctx.fill();

    // Front face body
    ctx.fillStyle = '#E04848';
    ctx.fillRect(x, bodyY, w, bodyH);
    // Front face highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x, bodyY, w, bodyH * 0.2);
    // Front face shadow
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(x, y + h * 0.7, w, h * 0.3);

    // Front face lid
    ctx.fillStyle = '#F06060';
    ctx.fillRect(x, y, w, lidH);
    // Front lid highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x, y, w, lidH * 0.35);

    // Front ribbon vertical
    ctx.fillStyle = '#FFD93D';
    ctx.fillRect(ribbonX, y, ribbonW, h);
    // Ribbon shadow
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(ribbonX + ribbonW - 2, y, 2, h);

    // Top face (lightest red)
    ctx.fillStyle = '#F57070';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.fill();
    // Top face highlight
    ctx.fillStyle = '#FF8888';
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 0.5);
    ctx.lineTo(x + w - 2, y + 0.5);
    ctx.lineTo(x + w - 5, y + 3);
    ctx.lineTo(x + 5, y + 3);
    ctx.closePath();
    ctx.fill();

    // Top ribbon horizontal
    ctx.fillStyle = '#FFD93D';
    ctx.beginPath();
    ctx.moveTo(x, y + lidH*0.5);
    ctx.lineTo(x + w, y + lidH*0.5);
    ctx.lineTo(x + w - isoDx, y - isoDy + lidH*0.5);
    ctx.lineTo(x - isoDx, y - isoDy + lidH*0.5);
    ctx.closePath();
    ctx.fill();

    // Top ribbon vertical
    ctx.fillStyle = '#FFD93D';
    ctx.beginPath();
    ctx.moveTo(ribbonX, y);
    ctx.lineTo(ribbonX + ribbonW, y);
    ctx.lineTo(ribbonX + ribbonW - isoDx, y - isoDy);
    ctx.lineTo(ribbonX - isoDx, y - isoDy);
    ctx.closePath();
    ctx.fill();

    // Bow on top center
    const bowCx = x + w/2 - isoDx*0.5;
    const bowCy = y - isoDy*0.5;
    const bowR = w * 0.12;
    ctx.fillStyle = '#FFD93D';
    ctx.beginPath();
    ctx.ellipse(bowCx - bowR*0.7, bowCy, bowR, bowR*0.7, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bowCx + bowR*0.7, bowCy, bowR, bowR*0.7, 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#E8B820';
    ctx.beginPath();
    ctx.arc(bowCx, bowCy, bowR*0.45, 0, Math.PI*2);
    ctx.fill();

    // Edges
    ctx.strokeStyle = 'rgba(100,20,20,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w, y + h);
    ctx.moveTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.stroke();
  },
  drawBookBlock(ctx, x, y, w, h, isoDx, isoDy){
    const coverW = w * 0.08;
    const pagesH = h - coverW;

    // Right face - spine (darkest blue)
    ctx.fillStyle = '#153D5C';
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    // Right face bottom shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.moveTo(x + w, y + h * 0.65);
    ctx.lineTo(x + w - isoDx, y + h * 0.65 - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // Front face - cover (medium blue)
    ctx.fillStyle = '#2C6E91';
    ctx.fillRect(x, y, w, h);
    // Front cover highlight
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, w, h * 0.15);
    // Front cover shadow bottom
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x, y + h * 0.7, w, h * 0.3);

    // Pages (white side) on front face
    ctx.fillStyle = '#F5F0E0';
    ctx.fillRect(x + coverW, y + coverW, w - coverW*2, pagesH);
    // Page lines
    ctx.strokeStyle = 'rgba(150,140,120,0.2)';
    ctx.lineWidth = 0.8;
    for(let i = 0; i < 5; i++){
      const ly = y + coverW + (pagesH/6) * (i+1);
      ctx.beginPath();
      ctx.moveTo(x + coverW, ly);
      ctx.lineTo(x + w - coverW, ly);
      ctx.stroke();
    }

    // Top face - cover (lightest blue)
    ctx.fillStyle = '#3E8CB5';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.fill();
    // Top face highlight
    ctx.fillStyle = '#5BA8D0';
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 0.5);
    ctx.lineTo(x + w - 2, y + 0.5);
    ctx.lineTo(x + w - 5, y + 3);
    ctx.lineTo(x + 5, y + 3);
    ctx.closePath();
    ctx.fill();

    // Top page edge
    ctx.fillStyle = '#F5F0E0';
    ctx.beginPath();
    ctx.moveTo(x + coverW, y + coverW*0.4);
    ctx.lineTo(x + w - coverW, y + coverW*0.4);
    ctx.lineTo(x + w - coverW - isoDx, y - isoDy + coverW*0.4);
    ctx.lineTo(x + coverW - isoDx, y - isoDy + coverW*0.4);
    ctx.closePath();
    ctx.fill();

    // Gold bookmark on top
    ctx.fillStyle = '#FFD700';
    const bmX = x + w * 0.75 - isoDx*0.5;
    const bmY = y - isoDy*0.5;
    ctx.fillRect(bmX - 3, bmY - 2, 6, h * 0.45 + isoDy*0.5);
    // Bookmark shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(bmX + 2, bmY - 1, 1.5, h * 0.45 + isoDy*0.5);

    // Edges
    ctx.strokeStyle = 'rgba(20,50,70,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x - isoDx, y - isoDy);
    ctx.closePath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w, y + h);
    ctx.moveTo(x + w - isoDx, y - isoDy);
    ctx.lineTo(x + w - isoDx, y + h - isoDy);
    ctx.stroke();
  },
  drawChar(ctx){
    const sx=this.screenX(this.char.x);
    const charH=70;
    const baseY=this.char.y;
    const bounce=this.char.bounceT>0 ? Math.sin((0.25-this.char.bounceT)/0.25*Math.PI)*6 : 0;
    const y=baseY-bounce;
    const squash = this.char.squash || 0;
    const sqH = 1 - squash;
    const sqW = 1 + squash * 0.3;
    const drawH = charH * sqH;
    const charY = y + (charH - drawH);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(sx, y + 2, 20 * sqW, 4.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Character
    ctx.save();
    ctx.translate(sx, charY);
    ctx.scale(sqW, sqH);
    drawCharacter(ctx, Storage.getCurrent(), charH, performance.now());
    ctx.restore();
  }
};

/* ============ 8. UI Wiring ============ */
function showModal(id){ document.getElementById(id).classList.add('show'); }
function hideModal(id){ document.getElementById(id).classList.remove('show'); }
function showResult(icon,title,sub){
  document.getElementById('result-icon').textContent=icon;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-sub').textContent=sub;
  showModal('modal-result');
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

/* ============ 9. Redeem codes ============ */
const REDEEM_CODES={
  'WELCOME100':{type:'coins',value:200,used:false},
  'CRAB888':   {type:'coins',value:888,used:false},
  'FANYANG':   {type:'coins',value:500,used:false},
  'GIVEMECHESS':{type:'skin',value:'pawn',used:false}
};
const K_REDEEM='jbc.redeemUsed';
function getRedeemUsed(){try{return JSON.parse(localStorage.getItem(K_REDEEM)||'[]');}catch(e){return[];}}
function setRedeemUsed(arr){localStorage.setItem(K_REDEEM,JSON.stringify(arr));}
function tryRedeem(code){
  code=code.trim().toUpperCase();
  const c=REDEEM_CODES[code];
  if(!c) return {ok:false,msg:'兑换码无效'};
  const used=getRedeemUsed();
  if(used.includes(code)) return {ok:false,msg:'该兑换码已使用'};
  if(c.type==='coins'){
    Storage.addCoins(c.value);
    used.push(code); setRedeemUsed(used);
    return {ok:true,msg:'获得 '+c.value+' 金币'};
  } else if(c.type==='skin'){
    Storage.unlock(c.value);
    used.push(code); setRedeemUsed(used);
    const s=SKINS.find(x=>x.id===c.value);
    return {ok:true,msg:'解锁皮肤：'+(s?s.name:c.value)};
  }
  return {ok:false,msg:'未知奖励'};
}

/* ============ 10. Init ============ */
function init(){
  // Home buttons
  document.getElementById('btn-start').addEventListener('click',()=>Router.show('play'));
  document.getElementById('btn-more').addEventListener('click',()=>Router.show('menu'));

  // Back buttons
  document.getElementById('btn-back-home').addEventListener('click',()=>Router.show('home'));
  document.getElementById('btn-back-menu-shop').addEventListener('click',()=>Router.show('menu'));
  document.getElementById('btn-back-menu-lottery').addEventListener('click',()=>Router.show('menu'));

  // Menu cards
  document.querySelectorAll('.menu-card').forEach(card=>{
    card.addEventListener('click',()=>{
      const t=card.dataset.target;
      if(t==='shop')    Router.show('shop');
      else if(t==='lottery') Router.show('lottery');
      else if(t==='tutorial') showModal('modal-tutorial');
      else if(t==='redeem')   showModal('modal-redeem');
    });
  });

  // Shop arrows
  document.getElementById('btn-skin-prev').addEventListener('click',()=>{
    Shop.index=(Shop.index-1+SKINS.length)%SKINS.length;
    Shop.drawMain(); Shop.drawPreview(); Shop.updateAction();
  });
  document.getElementById('btn-skin-next').addEventListener('click',()=>{
    Shop.index=(Shop.index+1)%SKINS.length;
    Shop.drawMain(); Shop.drawPreview(); Shop.updateAction();
  });

  // Lottery
  document.getElementById('btn-lottery').addEventListener('click',()=>Lottery.roll());
  document.getElementById('btn-close-result').addEventListener('click',()=>hideModal('modal-result'));

  // Tutorial
  document.getElementById('btn-close-tutorial').addEventListener('click',()=>hideModal('modal-tutorial'));

  // Redeem
  document.getElementById('btn-redeem-submit').addEventListener('click',()=>{
    const code=document.getElementById('redeem-input').value;
    const msgEl=document.getElementById('redeem-msg');
    const r=tryRedeem(code);
    msgEl.textContent=r.msg;
    msgEl.style.color=r.ok?'var(--green-2)':'#E85A4F';
    if(r.ok){
      document.getElementById('redeem-input').value='';
      if(Shop._lastRendered){
        document.getElementById('shop-coins').textContent=Storage.getCoins();
      }
      setTimeout(()=>{hideModal('modal-redeem');msgEl.textContent='';},900);
    }
  });
  document.getElementById('btn-redeem-cancel').addEventListener('click',()=>hideModal('modal-redeem'));

  // Gameover
  document.getElementById('btn-restart').addEventListener('click',()=>{
    hideModal('modal-gameover');
    Game.start();
  });
  document.getElementById('btn-revive').addEventListener('click',()=>{
    if(Storage.getCoins()<100){toast('金币不足');return;}
    Storage.setCoins(Storage.getCoins()-100);
    document.getElementById('stat-coins').textContent=Storage.getCoins();
    hideModal('modal-gameover');
    Game.revive();
  });

  // Pause → back to home (saves data automatically)
  document.getElementById('btn-pause').addEventListener('click',()=>{
    Game.running=false; cancelAnimationFrame(Game.rafId);
    Router.show('menu');
  });

  // Game touch controls
  const play=document.getElementById('view-play');
  const onDown=(e)=>{
    if(e.target.closest('.hud-pause')) return;
    e.preventDefault();
    Game.onPressStart();
  };
  const onUp=(e)=>{
    if(Game.charging){ e.preventDefault(); Game.onPressEnd(); }
  };
  play.addEventListener('touchstart',onDown,{passive:false});
  play.addEventListener('mousedown',onDown);
  document.addEventListener('touchend',onUp,{passive:false});
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchcancel',onUp);

  // Init game
  Game.init();
}

Game.revive=function(){
  // Place character on the last landed block (or at current x, snapped to last block)
  const lastB=this.char.landedOn;
  if(lastB){
    this.char.x=Math.min(this.char.x, lastB.x+lastB.w-2);
    this.char.x=Math.max(this.char.x, lastB.x+2);
    this.char.y=lastB.y;
  } else {
    // Fall back: place on first block
    const b=this.blocks[0];
    if(b){ this.char.x=b.x+b.w/2; this.char.y=b.y; }
  }
  this.char.vx=0; this.char.vy=0; this.char.rot=0;
  this.char.onGround=true;
  this.updateCamera();
  this.running=true;
  this.lastT=performance.now();
  this.loop();
};

window.addEventListener('DOMContentLoaded',init);
